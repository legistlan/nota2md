  site-url: https://legistlan.github.io/nota2md/
  repo-url: https://github.com/legistlan/nota2md
  navbar:
    background: "#f9f8f4"
    left:
      - href: index.qmd
        text: Home
      - href: pages/install.qmd
        text: Install
      - href: pages/cli.qmd
        text: Command line
      - href: pages/python.qmd
        text: Python
      - href: pages/sources.qmd
        text: Sources
      - href: pages/linking.qmd
        text: Linking
      - href: pages/reconstruction.qmd
        text: Reconstruction
      - href: pages/releases.qmd
        text: Releases
      - href: pages/scripts.qmd
        text: Scripts
      - href: https://legistlan.github.io/nota2md/dev/
        text: Developer docs
    right:
      - icon: github
        href: https://github.com/legistlan/nota2md
        aria-label: GitHub
