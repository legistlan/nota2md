[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nota2md"
description = "Build a DOF note's Markdown, reconstruct a law's current text from its notes, and read back its reform history."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import:
# they sit in function signatures, so they run when the module is defined.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# document2md (its own repository since issue #234) is only needed for the
# image/PDF OCR paths (imported lazily) — kept as an optional extra rather than
# a hard dependency so the HTML-only path stays lightweight.
dependencies = [
    "beautifulsoup4>=4.9",
    # 0.5 renombra el dataset de titulos a titulos.legal_provisions_titles,
    # el flujo que nota2md re-exporta (issue #166).
    "dofjson>=0.5.0",
    # nota2md.cache's own release-asset cache (issue #117). Direct now, not
    # just transitively via dofjson: the two caches are separate directories
    # on purpose, so nota2md imports platformdirs itself.
    "platformdirs>=4.0",
    "requests>=2.31",
    # The SCJN side of this project (transport, catalogue, crawl state,
    # provenance header) moved to its own package (issue #206/#207);
    # nota2md depends on it, never the reverse. 0.5.1 is the floor because
    # the SCJN path strips the outline markers with `scjn.outline` and
    # `markdown_de_snapshot(..., outline=False)`, both new in 0.5.1 (#291).
    "scjn>=0.5.1",
]
dynamic = ['version']

[project.optional-dependencies]
# A python-docx "scjn" extra went away with the .docx crawl path in issue
# #179 -- the SCJN's JSON API serves the same text as plain text. Not to be
# confused with the `scjn` package now in `dependencies` above.
ocr = ["document2md>=0.3.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/legistlan/nota2md"
Documentation = "https://legistlan.github.io/nota2md/"
Source = "https://github.com/legistlan/nota2md"
Issues = "https://github.com/legistlan/nota2md/issues"

[project.scripts]
nota2md = "nota2md.cli:main"

[tool.setuptools.packages.find]
include = ["nota2md", "nota2md.*"]

[tool.setuptools.dynamic]
version = {attr = 'nota2md.__version__'}

[tool.uv]
# The version is dynamic (read from nota2md/__init__.py); without it in the
# cache keys uv would not rebuild the editable install when __version__ bumps.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "nota2md/__init__.py" }]